name: Release

# Builds installers and portable packages for Windows, macOS (Apple Silicon
# and Intel) and Linux and publishes them as a GitHub release.
#
# How to release: set the new version in comitra/__init__.py (__version__)
# and push it to the default branch. If no tag v<version> exists yet, this
# workflow builds everything, creates the tag and publishes the release.
# Pushing a v* tag yourself, or "Run workflow" in the Actions tab with a
# tag, works too.

on:
  push:
    branches: ["**"]
    tags: ["v*"]
    paths:
      - "comitra/__init__.py"
      - ".github/workflows/release.yml"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to create, e.g. v1.0.0 (leave empty to only build)"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Decide what to release
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.decide.outputs.tag }}
      release: ${{ steps.decide.outputs.release }}
      build: ${{ steps.decide.outputs.build }}
    steps:
      - uses: actions/checkout@v4
      - id: decide
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          version=$(python3 -c "import re;print(re.search(r'__version__ = \"(.+?)\"', open('comitra/__init__.py').read()).group(1))")
          release=false; build=false; tag=""
          if [ "$REF_TYPE" = "tag" ]; then
            tag="$REF_NAME"; release=true; build=true
          elif [ "$EVENT" = "workflow_dispatch" ]; then
            build=true
            if [ -n "$INPUT_TAG" ]; then tag="$INPUT_TAG"; release=true; fi
          elif [ "$REF_NAME" = "$DEFAULT_BRANCH" ]; then
            tag="v$version"
            # Only release a version once: skip if its tag already exists.
            if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null 2>&1; then
              echo "Tag $tag already exists - nothing to release."
            else
              release=true; build=true
            fi
          fi
          if [ "$release" = true ] && [ "$tag" != "v$version" ]; then
            echo "::error::tag $tag does not match comitra.__version__ $version"; exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "release=$release" >> "$GITHUB_OUTPUT"
          echo "build=$build" >> "$GITHUB_OUTPUT"
          echo "version=$version tag=$tag release=$release build=$build"

  build:
    name: Build (${{ matrix.os }})
    needs: prepare
    if: needs.prepare.outputs.build == 'true'
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.optional }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04      # older glibc = AppImage runs on more distros
            optional: false
          - os: windows-latest
            optional: false
          - os: macos-latest      # Apple Silicon
            optional: false
          - os: macos-15-intel    # Intel Macs
            optional: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Qt system libraries (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libxkbcommon-x11-0 libfontconfig1 libdbus-1-3 libxcb-cursor0
      - name: Inno Setup (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }
      - name: Install
        run: python -m pip install . pyinstaller pillow pytest
      - name: Tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q
      - name: Build
        run: python packaging/build.py
      - uses: actions/upload-artifact@v4
        with:
          name: comitra-${{ matrix.os }}
          path: dist/release/*
          if-no-files-found: error

  publish:
    name: Publish release
    needs: [prepare, build]
    # Run even if the optional Intel Mac build failed; the file check below
    # makes sure every required package is present before anything is published.
    if: ${{ !cancelled() && needs.prepare.outputs.release == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true
      - name: Check required packages
        run: |
          set -e
          cd release
          ls -la
          for f in Comitra-windows-x64-setup.exe Comitra-windows-x64-portable.zip \
                   Comitra-macos-arm64.dmg Comitra-macos-arm64-portable.zip \
                   Comitra-linux-x86_64.AppImage Comitra-linux-x86_64-portable.tar.gz; do
            test -s "$f" || { echo "::error::missing $f"; exit 1; }
          done
          sha256sum Comitra-* > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        with:
          files: release/*
          tag_name: ${{ needs.prepare.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: Comitra ${{ needs.prepare.outputs.tag }}
          make_latest: "true"
          generate_release_notes: true
          body: |
            ## Download

            | Platform | Installer | Portable |
            | --- | --- | --- |
            | Windows 10/11 (x64) | **Comitra-windows-x64-setup.exe** | Comitra-windows-x64-portable.zip |
            | macOS 11+ (Apple Silicon) | **Comitra-macos-arm64.dmg** | Comitra-macos-arm64-portable.zip |
            | macOS 11+ (Intel) | Comitra-macos-x64.dmg (if listed below) | Comitra-macos-x64-portable.zip |
            | Linux (x86_64) | **Comitra-linux-x86_64.AppImage** | Comitra-linux-x86_64-portable.tar.gz |

            Comitra needs [git](https://git-scm.com/downloads). The packages are not code-signed yet:
            on Windows choose *More info → Run anyway*, on macOS right-click the app and choose *Open*,
            on Linux run `chmod +x Comitra-linux-x86_64.AppImage`. Verify downloads with `SHA256SUMS.txt`.

            Website: https://oguzcanozdemir.github.io/Comitra/
