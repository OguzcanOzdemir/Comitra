name: Release

# Builds installers and portable packages for Windows, macOS (Apple Silicon
# and Intel) and Linux and attaches them to a GitHub release. Either push a tag
# like v1.0.0, or start it from the Actions tab ("Run workflow") and enter the
# tag - the tag and the release are then created on the selected commit.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to create, e.g. v1.0.0 (leave empty to only build)"
        required: false
        default: ""

env:
  RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || inputs.tag }}

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.optional }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04      # older glibc = AppImage runs on more distros
            optional: false
          - os: windows-latest
            optional: false
          - os: macos-latest      # Apple Silicon
            optional: false
          - os: macos-15-intel    # Intel Macs
            optional: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Qt system libraries (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libxkbcommon-x11-0 libfontconfig1 libdbus-1-3 libxcb-cursor0
      - name: Inno Setup (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }
      - name: Install
        run: python -m pip install . pyinstaller pillow pytest
      - name: Tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q
      - name: Build
        run: python packaging/build.py
      - uses: actions/upload-artifact@v4
        with:
          name: comitra-${{ matrix.os }}
          path: dist/release/*
          if-no-files-found: error

  publish:
    name: Publish release
    needs: build
    # Run even if the optional Intel Mac build failed; the file check below
    # makes sure every required package is present before anything is published.
    if: ${{ !cancelled() && startsWith(github.ref_type == 'tag' && github.ref_name || inputs.tag, 'v') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check the tag matches the app version
        run: |
          v=$(python3 -c "import re;print(re.search(r'__version__ = \"(.+?)\"', open('comitra/__init__.py').read()).group(1))")
          test "v$v" = "$RELEASE_TAG" || { echo "::error::tag $RELEASE_TAG does not match version $v"; exit 1; }
      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true
      - name: Check required packages
        run: |
          set -e
          cd release
          ls -la
          for f in Comitra-windows-x64-setup.exe Comitra-windows-x64-portable.zip \
                   Comitra-macos-arm64.dmg Comitra-macos-arm64-portable.zip \
                   Comitra-linux-x86_64.AppImage Comitra-linux-x86_64-portable.tar.gz; do
            test -s "$f" || { echo "::error::missing $f"; exit 1; }
          done
          sha256sum Comitra-* > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        with:
          files: release/*
          tag_name: ${{ env.RELEASE_TAG }}
          target_commitish: ${{ github.sha }}
          name: Comitra ${{ env.RELEASE_TAG }}
          generate_release_notes: true
          body: |
            ## Download

            | Platform | Installer | Portable |
            | --- | --- | --- |
            | Windows 10/11 (x64) | **Comitra-windows-x64-setup.exe** | Comitra-windows-x64-portable.zip |
            | macOS 11+ (Apple Silicon) | **Comitra-macos-arm64.dmg** | Comitra-macos-arm64-portable.zip |
            | macOS 11+ (Intel) | Comitra-macos-x64.dmg (if listed below) | Comitra-macos-x64-portable.zip |
            | Linux (x86_64) | **Comitra-linux-x86_64.AppImage** | Comitra-linux-x86_64-portable.tar.gz |

            Comitra needs [git](https://git-scm.com/downloads). The packages are not code-signed yet:
            on Windows choose *More info → Run anyway*, on macOS right-click the app and choose *Open*,
            on Linux run `chmod +x Comitra-linux-x86_64.AppImage`. Verify downloads with `SHA256SUMS.txt`.

            Website: https://oguzcanozdemir.github.io/Comitra/
