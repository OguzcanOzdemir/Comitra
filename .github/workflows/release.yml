name: Release

# Push a tag like v1.0.0 to build installers and portable packages for
# Windows, macOS (Apple Silicon and Intel) and Linux and attach them to a
# GitHub release.  Can also be started by hand from the Actions tab.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.optional }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04      # older glibc = AppImage runs on more distros
            optional: false
          - os: windows-latest
            optional: false
          - os: macos-14          # Apple Silicon
            optional: false
          - os: macos-15-intel    # Intel Macs
            optional: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Qt system libraries (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libxkbcommon-x11-0 libfontconfig1 libdbus-1-3 libxcb-cursor0
      - name: Inno Setup (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }
      - name: Install
        run: python -m pip install . pyinstaller pillow pytest
      - name: Tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q
      - name: Build
        run: python packaging/build.py
      - uses: actions/upload-artifact@v4
        with:
          name: comitra-${{ matrix.os }}
          path: dist/release/*
          if-no-files-found: error

  publish:
    name: Publish release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true
